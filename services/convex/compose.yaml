# PostgreSQL is a separate Dokploy service, reachable on dokploy-network.
# No backend port is published: Traefik terminates HTTPS on 3210/3211.
services:
  backend:
    image: ghcr.io/get-convex/convex-backend:02fe59be03b7892072d95229ab82c310a15fb222
    stop_grace_period: 30s
    stop_signal: SIGINT
    restart: unless-stopped
    mem_limit: 1536m
    volumes:
      - data:/convex/data
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME}
      - INSTANCE_SECRET=${INSTANCE_SECRET}
      - POSTGRES_URL=${POSTGRES_URL}
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN}
      - DO_NOT_REQUIRE_SSL=1
      - DISABLE_BEACON=true
      - REDACT_LOGS_TO_CLIENT=true
      - DOCUMENT_RETENTION_DELAY=172800
      - APPLICATION_MAX_CONCURRENT_MUTATIONS=16
      - APPLICATION_MAX_CONCURRENT_QUERIES=16
      - APPLICATION_MAX_CONCURRENT_V8_ACTIONS=16
      - APPLICATION_MAX_CONCURRENT_NODE_ACTIONS=4
      - AWS_REGION=garage
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_FORCE_PATH_STYLE=true
      - AWS_S3_DISABLE_CHECKSUMS=true
      - AWS_S3_DISABLE_SSE=true
      - S3_ENDPOINT_URL=http://identite-convex-s3:3900
      - S3_STORAGE_EXPORTS_BUCKET=idn-convex-exports
      - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET=idn-convex-imports
      - S3_STORAGE_MODULES_BUCKET=idn-convex-modules
      - S3_STORAGE_FILES_BUCKET=idn-convex-files
      - S3_STORAGE_SEARCH_BUCKET=idn-convex-search
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    networks:
      - dokploy-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:02fe59be03b7892072d95229ab82c310a15fb222
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:6792:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${CONVEX_CLOUD_ORIGIN}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:

networks:
  dokploy-network:
    external: true
